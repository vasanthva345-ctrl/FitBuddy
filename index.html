<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitBuddy - AI Fitness Plan Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin-bottom: 10px;
            font-size: 32px;
        }

        .header p {
            color: #6b7280;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #6b7280;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px auto;
                padding: 12px;
            }

            .card {
                padding: 25px 20px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="header">
                <h1>🏋️ FitBuddy</h1>
                <p>AI-Powered Personalized Fitness Plan Generator</p>
            </div>

            <form action="/generate-workout" method="post">

                <div class="form-group">
                    <label for="username">Name</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="user_id">User ID</label>

                    <input
                        type="text"
                        id="user_id"
                        name="user_id"
                        placeholder="Enter your user ID"
                        required
                    >
                </div>

                <div class="row">

                    <div class="form-group">
                        <label for="age">Age</label>

                        <input
                            type="number"
                            id="age"
                            name="age"
                            placeholder="Age"
                            min="1"
                            max="120"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="weight">Weight (kg)</label>

                        <input
                            type="number"
                            id="weight"
                            name="weight"
                            placeholder="Weight"
                            min="1"
                            step="0.1"
                            required
                        >
                    </div>

                </div>

                <div class="form-group">
                    <label for="goal">Fitness Goal</label>

                    <select
                        id="goal"
                        name="goal"
                        required
                    >
                        <option value="">Select your goal</option>
                        <option value="Weight Loss">Weight Loss</option>
                        <option value="Muscle Gain">Muscle Gain</option>
                        <option value="General Fitness">General Fitness</option>
                        <option value="Endurance">Endurance</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="intensity">Workout Intensity</label>

                    <select
                        id="intensity"
                        name="intensity"
                        required
                    >
                        <option value="">Select intensity</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

                <button
                    type="submit"
                    class="button"
                >
                    Generate My Workout Plan
                </button>

            </form>

            <div class="footer">
                Powered by FastAPI + Google Gemini
            </div>

        </div>

    </div>

</body>

</html>
